<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }

    /* Ambient animated background orbs */
    @keyframes pulseGlow1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(60px, 20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseGlow2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-50px, -25px) scale(1.2); opacity: 0.5; }
    }
    .glow-orb-1 {
      animation: pulseGlow1 8s ease-in-out infinite;
    }
    .glow-orb-2 {
      animation: pulseGlow2 10s ease-in-out infinite;
    }

    /* Dynamic chat/flow cards floating smoothly in background corners */
    @keyframes floatCardLeft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatCardRight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    .floating-card-1 {
      animation: floatCardLeft 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCardRight 7s ease-in-out infinite;
    }

    /* Signal flow dots */
    @keyframes signalMove {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: signalMove 3s linear infinite;
    }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint / Flow Grid Lines -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Ambient Glowing Orbs (Dynamic background) -->
  <g class="glow-orb-1" filter="url(#glow)">
    <circle cx="200" cy="130" r="120" fill="#0284c7" />
  </g>
  <g class="glow-orb-2" filter="url(#glow)">
    <circle cx="1020" cy="270" r="140" fill="#7c3aed" />
  </g>

  <!-- Ambient Flow Node 1 (Background Left) -->
  <g class="floating-card-1" opacity="0.65">
    <rect x="50" y="60" width="220" height="76" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="75" cy="98" r="14" fill="#0284c7" />
    <path d="M71 98 L74 101 L80 94" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="100" y="93" class="card-label">STEP 01: QUALIFY</text>
    <text x="100" y="112" font-family="sans-serif" font-size="12" fill="#cbd5e1">What's your project goal?</text>
  </g>

  <!-- Animated connecting flow lines -->
  <path d="M 270 98 Q 330 98 340 160" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.4" />
  <path d="M 860 250 Q 880 310 930 310" fill="none" stroke="#c084fc" stroke-width="2" class="flow-line" opacity="0.4" />

  <!-- Ambient Flow Node 2 (Background Right) -->
  <g class="floating-card-2" opacity="0.65">
    <rect x="930" y="270" width="220" height="76" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="955" cy="308" r="14" fill="#9333ea" />
    <text x="955" y="313" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">AI</text>
    <text x="980" y="303" class="card-label" fill="#c084fc">STEP 02: ADAPT</text>
    <text x="980" y="322" font-family="sans-serif" font-size="12" fill="#cbd5e1">Routing to sales rep...</text>
  </g>

  <!-- FOREGROUND: Header Brand & Title (Clean, Crisp, Visible) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="440" y="48" width="320" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="460" cy="65" r="5" fill="#10b981" />
    <text x="590" y="70" text-anchor="middle" class="badge-text" fill="#38bdf8" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="160" class="title-text" fill="url(#titleGrad)">
      Conversational AI &amp; Form Builders
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" class="subtitle-text" fill="url(#subGrad)">
      Curated SaaS Platforms &amp; Open-Source Self-Hosted Form Engines
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(0, 245)">
      <!-- Pill 1 -->
      <rect x="230" y="0" width="210" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="335" y="24" text-anchor="middle" class="badge-text" fill="#93c5fd">💬 Chat-Style Multi-Turn</text>

      <!-- Pill 2 -->
      <rect x="460" y="0" width="280" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="600" y="24" text-anchor="middle" class="badge-text" fill="#a78bfa">⚡ Visual Logic &amp; Slot Filling</text>

      <!-- Pill 3 -->
      <rect x="760" y="0" width="210" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="865" y="24" text-anchor="middle" class="badge-text" fill="#6ee7b7">🚀 Self-Hosted &amp; Cloud</text>
    </g>

    <!-- Bottom Metric Highlight -->
    <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="0.5">
      Comprehensive Directory • Pricing, Limits &amp; Company Scale • Real-Time GitHub Stars
    </text>
  </g>
</svg>
